name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build must not depend on real credentials. Anything that reaches for a
  # live service at build time is a bug this will surface.
  NEXT_PUBLIC_SITE_URL: https://v4you.tech
  PAYLOAD_SECRET: ci-placeholder-secret-not-used-for-anything-real
  DATABASE_URI: postgresql://ci:ci@localhost:5432/ci

jobs:
  verify:
    name: Lint, format, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .next
          retention-days: 1

  audit:
    name: Accessibility and content
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: .next

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      # Against a production build rather than a dev server: dev compiles each
      # route on first request, which makes a scan measure compile time instead
      # of the site.
      - name: Start
        run: |
          pnpm start &
          npx wait-on http://localhost:3000 --timeout 120000

      # docs/06 §C3: zero axe violations on every route. The scan also asserts
      # button contrast numerically, because axe returns "incomplete" rather
      # than a verdict where a clipped layer paints the background.
      - name: Accessibility
        run: pnpm a11y

      # docs/06 §C3: the mechanical half of "test by unplugging the mouse".
      # Skip link first, no positive tabindex, a visible ring on everything,
      # and no focused element carrying a clip-path that would slice it.
      - name: Keyboard walkthrough
        run: pnpm audit:keyboard

      # docs/06 §A4 — the mechanical half of the content quality gate: unique
      # titles and descriptions, canonicals, expected JSON-LD, no banned
      # schema, 400-word and 3-link minimums.
      - name: Content and structured data
        run: pnpm audit:content

      # docs/02 §4 — alt attributes, intrinsic dimensions, and a size budget on
      # static assets. Cheap now; the point is the first case-study screenshot.
      - name: Image pipeline
        run: pnpm audit:images

      # T-077 and docs/06 §A3: every internal link resolves, nothing is more
      # than three clicks from home, and nothing in the sitemap is unreachable
      # by following links. It caught /cookie-policy sitting in the sitemap
      # with no link to it anywhere.
      - name: Link crawl
        run: pnpm audit:links

      # CLAUDE.md's page definition of done: 95+ across all four categories.
      #
      # This runs in CI rather than locally because the performance number is
      # not measurable on a developer laptop. Measured repeatedly against one
      # unchanged build on an 8GB machine, the same route scored anywhere from
      # 72 to 98 — the throttled CPU profile Lighthouse emulates is meaningless
      # when the real CPU is already saturated. Accessibility, best practices,
      # SEO and CLS were stable across every one of those runs; only
      # performance moved.
      #
      # A CI runner is quieter and consistent, which is the minimum a
      # performance budget needs to mean anything.
      - name: Lighthouse
        run: pnpm audit:lighthouse
