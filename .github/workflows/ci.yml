name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, format, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # The build must not depend on real credentials. Anything that reaches for
      # a live service at build time is a bug this will surface.
      NEXT_PUBLIC_SITE_URL: https://v4you.tech
      PAYLOAD_SECRET: ci-placeholder-secret-not-used-for-anything-real
      DATABASE_URI: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
